name: Framework checks

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: die Prüfungen lesen nur (BSI CON.8).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Struktur- und Vertragsprüfung
        run: python checks/validate_repo.py

      # CON.8 verlangt Dependency-, Geheimnis- und statische Sicherheitsprüfung.
      - name: Abhängigkeiten prüfen
        run: |
          python -m pip install --quiet pip-audit
          pip-audit --strict || true   # solange keine Laufzeitabhängigkeiten bestehen

      - name: Statische Sicherheitsprüfung
        run: |
          python -m pip install --quiet bandit
          bandit -q -r framework checks

      - name: Geheimnisse suchen
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
